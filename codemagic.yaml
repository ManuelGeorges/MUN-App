workflows:
  ios-workflow:
    name: iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      xcode: latest
      cocoapods: default

      vars:
        XCODE_PROJECT: "ios-app/MIANU.xcodeproj"
        XCODE_SCHEME: "MIANU"
        BUNDLE_ID: "com.mianu.paymentapp"

    scripts:
      - name: Install dependencies
        script: |
          echo "Installing dependencies..."

          # لو المشروع يستخدم CocoaPods:
          # cd ios-app
          # pod install

      - name: Automatic iOS code signing
        script: |
          keychain initialize

          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

      - name: Apply signing to MIANU project
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - user@example.com