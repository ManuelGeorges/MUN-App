workflows:
  ios-workflow:
    name: MIANU iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: "Mianu payment app"

    environment:
      vars:
        XCODE_PROJECT: "ios-app/MIANU.xcodeproj"
        XCODE_SCHEME: "MIANU"
        BUNDLE_ID: "com.mianu.paymentapp"
        TEAM_ID: "XMBVV283C4"
      xcode: latest
      cocoapods: default

    scripts:

      - name: Increment Build Number
        script: |
          cd ios-app
          agvtool new-version -all $(date +%s)

      - name: Automatic iOS Code Signing
        script: |
          # Initialize a clean keychain
          keychain initialize

          # Remove stale provisioning profiles
          find ~/Library -name "*.mobileprovision" -delete

          # Fetch or create App Store signing certificate
          # and provisioning profile for MIANU
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Install the signing certificate into the keychain
          keychain add-certificates

      - name: Apply Signing Profiles
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT"

      - name: Build and Sign IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true