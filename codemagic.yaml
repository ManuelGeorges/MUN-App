workflows:
  ios-workflow:
    name: iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mianu.paymentapp

      vars:
        XCODE_PROJECT: "ios-app/MIANU.xcodeproj"
        XCODE_SCHEME: "MIANU"

    scripts:
      - name: Install dependencies
        script: |
          echo "Installing dependencies..."

          # لو المشروع يستخدم CocoaPods:
          # cd ios-app
          # pod install

      - name: Set up code signing
        script: |
          keychain initialize
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - user@example.com