workflows:
  ios-workflow:
    name: MIANU iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: "Mianu payment app"

    environment:
      groups:
        - ios-secrets

      vars:
        XCODE_PROJECT: "ios-app/MIANU.xcodeproj"
        XCODE_SCHEME: "MIANU"
        BUNDLE_ID: "com.mianu.paymentapp"
        TEAM_ID: "XMBVV283C4"

      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate App Icons
        script: |
          # Use sips (built-in macOS tool) to generate all required icon sizes from logo.png
          SOURCE_IMAGE="logo.png"
          ICONSET_DIR="ios-app/MIANU/Assets.xcassets/AppIcon.appiconset"
          
          echo "Generating icons from $SOURCE_IMAGE..."
          
          # List of sizes needed for iOS (square pixels)
          declare -a sizes=("20" "29" "40" "58" "60" "76" "80" "87" "120" "152" "167" "180" "1024")
          
          for size in "${sizes[@]}"; do
              sips -z $size $size "$SOURCE_IMAGE" --out "$ICONSET_DIR/Icon-$size.png"
          done
          
          echo "Icons generated successfully."

      - name: Increment Build Number
        script: |
          cd ios-app
          agvtool new-version -all $(date +%s)

      - name: Automatic iOS Code Signing
        script: |
          keychain initialize

          find ~/Library -name "*.mobileprovision" -delete

          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

      - name: Apply Signing Profiles
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT"

      - name: Build and Sign IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true